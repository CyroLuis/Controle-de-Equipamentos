<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Equipamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h3 class="mb-0">Controle de Equipamentos</h3>
            <a th:href="@{/cadastro}" class="btn btn-light btn-sm">
                <i class="bi bi-plus-circle"></i> Novo Equipamento
            </a>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover table-striped">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Equipamento</th>
                        <th>Data Entrada</th>
                        <th>Data Saída</th>
                        <th>Operador</th>
                        <th class="text-center">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="equip : ${equipamentos}">
                        <td th:text="${equip.id}"></td>
                        <td th:text="${equip.nome}" class="fw-bold"></td>
                        <td th:text="${#temporals.format(equip.dataDeEntrada, 'dd/MM/yyyy')}"></td>
                        <td th:text="${#temporals.format(equip.dataDeSaida, 'dd/MM/yyyy')}"></td>
                        <td th:text="${equip.nomeOperador}"></td>
                        <td class="text-center">
                            <button class="btn btn-warning btn-sm">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <a th:href="@{/excluir/{id}(id=${equip.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Tem certeza que deseja excluir este equipamento?')">
                                <i class="bi bi-trash"></i> Excluir
                            </a>
                            <a th:href="@{/detalhes/{id}(id=${equip.id})}" class="btn btn-info btn-sm">
                                <i class="bi bi-eye"></i> Ver Detalhes
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(equipamentos)}">
                        <td colspan="6" class="text-center text-muted">Nenhum equipamento cadastrado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
