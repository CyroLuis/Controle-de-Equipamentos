<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Equipamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<div class="card">
    <div class="card-header bg-primary text-white">
        <h2 class="mb-0">Registrar Equipamento</h2>
    </div>
    <div class="card-body">
        <form th:action="@{/salvar}" th:object="${equipamento}" method="post" enctype="multipart/form-data">

            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Nome do Equipamento</label>
                <input type="text" th:field="*{nome}" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary">
                <span th:text="${id == null ? 'Cadastrar' : 'Atualizar'}"></span>
            </button>

            <div class="row">

                <div class="col-md-10 mb-3">
                    <label for="nome" class="form-label">Nome do Equipamento</label>
                    <input type="text" th:field="*{nome}" class="form-control" id="nome" placeholder="Ex: Impressora" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="entrada" class="form-label">Data de Entrada</label>
                    <input type="date" th:field="*{dataDeEntrada}" class="form-control" id="entrada" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="saida" class="form-label">Data de Saída</label>
                    <input type="date" th:field="*{dataDeSaida}" class="form-control" id="saida">
                </div>
            </div>

            <div class="mb-3">
                <label for="operador" class="form-label">Nome do Operador</label>
                <input type="text" th:field="*{nomeOperador}" class="form-control" id="operador" placeholder="Ex: Cyro Luis" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Comentários</label>
                <textarea class="form-control" th:field="*{comentario}" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Foto do Equipamento</label>
                <input type="file" name="foto" class="form-control" accept="image/*">
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-success">Salvar Registro</button>
                <a th:href="@{/home}" class="btn btn-secondary">Cancelar</a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
